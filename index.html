<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Buzz</title>
<meta name="theme-color" content="#0b4fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buzz">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favIcon">
<link rel="manifest" id="manifest">
<style>
  :root{--bg1:#0b4fd6;--bg2:#062f8a;--fg:#fff;--dim:rgba(255,255,255,.65);--card:rgba(255,255,255,.1);--on:#7CFFB2}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));background-color:var(--bg2);color:var(--fg);
    font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;
    padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));overflow-x:hidden}
  .top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:280px}
  #power{width:190px;height:190px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.08);
    box-shadow:0 0 0 3px rgba(255,255,255,.25),0 12px 40px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .12s,background .2s,box-shadow .2s}
  #power:active{transform:scale(.95)}
  #power svg{width:92px;height:92px;stroke:var(--fg);transition:stroke .2s}
  body.on #power{background:rgba(124,255,178,.14);box-shadow:0 0 0 3px var(--on),0 0 50px rgba(124,255,178,.55)}
  body.on #power svg{stroke:var(--on)}
  body.on.vibe #power{animation:buzz .12s linear infinite}
  @keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
  #status{font-size:15px;color:var(--dim);min-height:20px;text-align:center}
  .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border-radius:18px;padding:14px 16px}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--dim);margin-bottom:10px}
  .row b{color:var(--fg);font-weight:600}
  input[type=range]{width:100%;accent-color:#fff;height:28px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{flex:1 1 auto;min-width:88px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;
    color:var(--fg);font-size:14px;cursor:pointer}
  .chip.sel{background:#fff;color:var(--bg2);border-color:#fff;font-weight:600}
  .hidden{display:none!important}
  #warn{font-size:13px;color:#ffd98a;text-align:center;line-height:1.4}
</style>
</head>
<body>
  <div class="top">
    <button id="power" aria-label="Power">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    </button>
    <div id="status">Off</div>
    <div id="warn" class="hidden"></div>
  </div>

  <div class="panel">
    <div class="card" id="intCard">
      <div class="row"><span>Intensity</span><b id="intVal">100%</b></div>
      <input type="range" id="intensity" min="10" max="100" step="5" value="100">
    </div>
    <div class="card" id="patCard">
      <div class="row"><span>Pattern</span></div>
      <div class="chips" id="patterns"></div>
    </div>
    <div class="card" id="nudgeCard">
      <div class="row"><span>Nudge every</span><b id="nudgeVal">20 s</b></div>
      <input type="range" id="nudge" min="5" max="120" step="5" value="20">
    </div>
  </div>


<script>
(() => {
  const $ = id => document.getElementById(id);
  const canVibrate = 'vibrate' in navigator;

  // Patterns: list of [ms, level 0..1]
  const PATTERNS = {
    steady:    { name:'Steady',    seg:[[1000,1]] },
    pulse:     { name:'Pulse',     seg:[[300,1],[300,0]] },
    wave:      { name:'Wave',      seg:[[150,.3],[150,.45],[150,.6],[150,.75],[150,.9],[150,1],[150,.9],[150,.75],[150,.6],[150,.45]] },
    heartbeat: { name:'Heartbeat', seg:[[120,1],[100,0],[180,1],[700,0]] },
    tick:      { name:'Tick',      seg:[[60,1],[440,0]] },
    nudge:     { name:'Nudge (jiggler)', seg:null }
  };

  const store = {
    get(k,d){ try{ const v = localStorage.getItem('buzz_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem('buzz_'+k, JSON.stringify(v)); }catch(e){} }
  };

  let state = {
    on:false,
    intensity: store.get('intensity', 100),
    pattern: 'nudge',
    nudge: store.get('nudge', 20)
  };
  let timer = null, segIdx = 0, wakeLock = null;

  // ---------- UI setup ----------
  const patWrap = $('patterns');
  for (const [k,p] of Object.entries(PATTERNS)) {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.v = k; b.textContent = p.name;
    patWrap.appendChild(b);
  }
  function renderUI(){
    document.body.classList.toggle('on', state.on);
    document.body.classList.add('vibe');
    document.querySelectorAll('#patterns .chip').forEach(c=>c.classList.toggle('sel', c.dataset.v===state.pattern));
    $('intensity').value = state.intensity; $('intVal').textContent = state.intensity+'%';
    $('nudge').value = state.nudge; $('nudgeVal').textContent = state.nudge+' s';
    $('nudgeCard').classList.toggle('hidden', state.pattern!=='nudge');
    const w = $('warn');
    if (!canVibrate) { w.textContent = 'This browser cannot vibrate (iPhone Safari blocks it).'; w.classList.remove('hidden'); }
    else w.classList.add('hidden');
    $('status').textContent = state.on
      ? PATTERNS[state.pattern].name + ' · ' + state.intensity + '%'
      : 'Off';
  }

  $('power').addEventListener('click', () => state.on ? stop() : start());
  $('patterns').addEventListener('click', e => {
    const v = e.target.dataset && e.target.dataset.v; if(!v) return;
    state.pattern = v; restartVibe(); renderUI();
  });
  $('intensity').addEventListener('input', e => { state.intensity = +e.target.value; store.set('intensity', state.intensity); renderUI(); });
  $('nudge').addEventListener('input', e => { state.nudge = +e.target.value; store.set('nudge', state.nudge); renderUI(); });

  // ---------- Vibration engine ----------
  // Phones cannot vary motor strength, so lower intensity = PWM (short on/off slices).
  function segToPattern(ms, level){
    const I = level * state.intensity / 100;
    if (I >= 0.95) return [ms];
    const slot = 40, n = Math.max(1, Math.round(ms / slot)), on = Math.max(8, Math.round(slot * I)), off = Math.max(0, slot - on);
    const out = [];
    for (let i=0;i<n;i++){ out.push(on, off); }
    return out.slice(0, 98); // Chrome caps patterns at 99 entries
  }
  function currentSegments(){
    if (state.pattern==='nudge') return [[500,1],[state.nudge*1000,0]];
    return PATTERNS[state.pattern].seg;
  }
  function step(){
    if (!state.on) return;
    const segs = currentSegments();
    if (segIdx >= segs.length) segIdx = 0;
    const [ms, lvl] = segs[segIdx++];
    if (lvl > 0 && canVibrate) navigator.vibrate(segToPattern(ms, lvl));
    else if (canVibrate) navigator.vibrate(0);
    timer = setTimeout(step, ms);
  }
  function restartVibe(){
    if (!state.on) return;
    clearTimeout(timer); segIdx = 0; step();
  }


  // ---------- Wake lock (keeps screen on; vibration stops if screen sleeps) ----------
  async function lockWake(){
    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch(e){}
  }
  function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState==='visible' && state.on) { lockWake(); restartVibe(); }
  });

  // ---------- start / stop ----------
  function start(){
    state.on = true; lockWake();
    segIdx = 0; step();
    renderUI();
  }
  function stop(){
    state.on = false; clearTimeout(timer); if (canVibrate) navigator.vibrate(0);
    releaseWake(); renderUI();
  }

  // ---------- PWA bits: icon + manifest generated in-page (single file) ----------
  function iconPNG(size){
    const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
    const gr = g.createRadialGradient(size/2,size*.35,size*.05,size/2,size/2,size*.7);
    gr.addColorStop(0,'#1a63f0'); gr.addColorStop(1,'#062f8a'); g.fillStyle = gr; g.fillRect(0,0,size,size);
    g.strokeStyle = '#fff'; g.lineWidth = size*.08; g.lineCap = 'round';
    g.beginPath(); g.moveTo(size/2,size*.2); g.lineTo(size/2,size*.5); g.stroke();
    g.beginPath(); g.arc(size/2,size*.55,size*.26,-Math.PI*.3,Math.PI*1.3); g.stroke();
    return c.toDataURL('image/png');
  }
  try {
    const i180 = iconPNG(180), i192 = iconPNG(192), i512 = iconPNG(512);
    $('appleIcon').href = i180; $('favIcon').href = i192;
    const base = location.href.split('#')[0].split('?')[0];
    const manifest = { name:'Buzz', short_name:'Buzz', start_url:base, scope:base.replace(/[^/]*$/,''), display:'standalone',
      background_color:'#062f8a', theme_color:'#0b4fd6', orientation:'portrait',
      icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}] };
    $('manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  } catch(e){}

  renderUI();
})();
</script>
</body>
</html>
